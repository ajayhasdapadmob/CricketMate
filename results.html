<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>CrickMate - Match Results</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #0f172a;
}

.header {
    background: #0f172a;
    color: white;
    padding: 18px;
}

.header h1 {
    margin: 0;
    font-size: 23px;
}

.header p {
    margin: 5px 0 0;
    color: #94a3b8;
    font-size: 13px;
}

.container {
    max-width: 800px;
    margin: auto;
    padding: 15px;
}

.back {
    display: inline-block;
    margin-bottom: 15px;
    color: #0f172a;
    text-decoration: none;
    font-weight: bold;
}

.card {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 15px;
}

.page-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 15px;
}

.loading {
    text-align: center;
    padding: 25px;
    color: #64748b;
}

.message {
    display: none;
    padding: 12px;
    border-radius: 9px;
    margin-bottom: 12px;
}

.message.show {
    display: block;
}

.message.error {
    background: #fee2e2;
    color: #991b1b;
}

.message.success {
    background: #dcfce7;
    color: #166534;
}

/* RESULT CARD */

.result-card {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 15px;
    box-shadow: 0 2px 5px rgba(0,0,0,.04);
}

.match-number {
    font-size: 13px;
    color: #64748b;
    font-weight: bold;
    margin-bottom: 10px;
}

.match-date {
    font-size: 12px;
    color: #64748b;
    margin-bottom: 14px;
}

.teams {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
}

.team {
    text-align: center;
    font-weight: bold;
}

.team-name {
    font-size: 15px;
}

.team-score {
    font-size: 21px;
    margin-top: 6px;
}

.vs {
    color: #64748b;
    font-weight: bold;
}

.winner {
    margin-top: 15px;
    padding: 12px;
    border-radius: 9px;
    background: #dcfce7;
    color: #166534;
    text-align: center;
    font-weight: bold;
}

.result-text {
    margin-top: 10px;
    padding: 10px;
    background: #f8fafc;
    border-radius: 8px;
    text-align: center;
    font-size: 14px;
}

.status {
    display: inline-block;
    margin-top: 10px;
    padding: 5px 9px;
    border-radius: 6px;
    background: #dcfce7;
    color: #166534;
    font-size: 12px;
    font-weight: bold;
}

.empty {
    text-align: center;
    padding: 35px 15px;
    color: #64748b;
}

@media(max-width:500px) {

    .teams {
        gap: 5px;
    }

    .team-name {
        font-size: 13px;
    }

    .team-score {
        font-size: 19px;
    }

}

</style>

</head>


<body>


<header class="header">

    <h1>🏏 CrickMate</h1>

    <p>
        Match Results & Winners
    </p>

</header>


<main class="container">


    <a
        id="backBtn"
        href="#"
        class="back"
    >
        ← Back
    </a>


    <div
        id="message"
        class="message"
    ></div>


    <div class="card">

        <div class="page-title">
            🏆 Match Results
        </div>

        <div
            id="loading"
            class="loading"
        >
            🔄 Loading results...
        </div>

        <!-- IMPORTANT -->
        <!-- JS isi container ke andar results dalega -->

        <div
            id="resultsContainer"
        ></div>

    </div>


</main>


<script
    type="module"
    src="./js/results.js"
></script>


</body>

</html>
