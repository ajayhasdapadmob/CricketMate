<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Admin Tournaments - CrickMate</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #0f172a;
}

.header {
    background: #0f172a;
    color: white;
    padding: 18px 15px;
}

.header-inner {
    max-width: 1100px;
    margin: auto;
}

.header h1 {
    margin: 0;
    font-size: 22px;
}

.header p {
    margin: 5px 0 0;
    color: #94a3b8;
    font-size: 13px;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px 15px 40px;
}

.back {
    display: inline-block;
    margin-bottom: 18px;
    color: #0f172a;
    text-decoration: none;
    font-weight: bold;
}

.toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
}

.toolbar h2 {
    margin: 0;
    font-size: 20px;
}

.count {
    background: #e2e8f0;
    padding: 6px 11px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.list {
    display: grid;
    gap: 15px;
}

.tournament-card {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 18px;
}

.tournament-top {
    display: flex;
    justify-content: space-between;
    gap: 15px;
}

.tournament-name {
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 6px;
}

.tournament-id {
    color: #64748b;
    font-size: 11px;
    word-break: break-all;
}

.status {
    height: fit-content;
    padding: 6px 10px;
    border-radius: 20px;
    background: #dcfce7;
    color: #166534;
    font-size: 11px;
    font-weight: bold;
}

.details {
    display: grid;
    grid-template-columns:
        repeat(4, 1fr);
    gap: 10px;
    margin-top: 18px;
}

.detail {
    background: #f8fafc;
    padding: 11px;
    border-radius: 9px;
}

.detail-label {
    display: block;
    color: #64748b;
    font-size: 11px;
    margin-bottom: 4px;
}

.detail-value {
    font-weight: bold;
    font-size: 13px;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 18px;
}

.btn {
    display: inline-block;
    border: 0;
    border-radius: 8px;
    padding: 10px 13px;
    font-size: 12px;
    font-weight: bold;
    text-decoration: none;
    cursor: pointer;
}

.btn-main {
    background: #0f172a;
    color: white;
}

.btn-team {
    background: #dbeafe;
    color: #1e40af;
}

.btn-match {
    background: #dcfce7;
    color: #166534;
}

.btn-point {
    background: #fef3c7;
    color: #92400e;
}

.loading,
.empty,
.error {
    background: white;
    border-radius: 15px;
    padding: 30px;
    text-align: center;
    border: 1px solid #e2e8f0;
}

.error {
    color: #991b1b;
    background: #fee2e2;
}

@media (max-width: 700px) {

    .details {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .tournament-top {
        flex-direction: column;
    }

}

@media (max-width: 450px) {

    .details {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<header class="header">

    <div class="header-inner">

        <h1>
            🏏 CrickMate Admin
        </h1>

        <p>
            Tournament Management
        </p>

    </div>

</header>


<main class="container">


    <a
        href="admin.html"
        class="back"
    >
        ← Admin Dashboard
    </a>


    <div class="toolbar">

        <h2>
            🏆 Tournaments
        </h2>

        <span
            id="tournamentCount"
            class="count"
        >
            0
        </span>

    </div>


    <div
        id="tournamentList"
        class="list"
    >

        <div class="loading">
            🔥 Loading tournaments...
        </div>

    </div>


</main>


<script
    type="module"
    src="./js/admin-tournaments.js"
></script>


</body>

</html>
