<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Team Players - CrickMate</title>

<link
rel="stylesheet"
href="./css/style.css"
>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6f9;
}

.topbar{
background:#0b1f3a;
color:white;
padding:15px;
}

.topbar-inner{
max-width:1000px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:23px;
font-weight:bold;
}

.logo span{
color:#22c55e;
}

.back{
color:white;
text-decoration:none;
background:#ffffff18;
padding:9px 13px;
border-radius:8px;
}

#teamContainer{
max-width:1000px;
margin:20px auto;
padding:0 15px 40px;
}

.team-profile,
.section-card{
background:white;
border-radius:16px;
padding:20px;
margin-bottom:18px;
box-shadow:0 4px 15px #00000010;
}

.team-profile{
text-align:center;
}

.team-logo-large{
width:80px;
height:80px;
margin:auto;
border-radius:50%;
background:#e8edf3;
display:flex;
align-items:center;
justify-content:center;
font-size:38px;
overflow:hidden;
}

.team-logo-large img{
width:100%;
height:100%;
object-fit:cover;
}

.team-profile h1{
margin:12px 0 5px;
}

.team-subtitle,
.team-city{
color:#64748b;
}

.section-card h2{
margin-top:0;
}

.details-grid,
.stats-grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(130px,1fr));
gap:12px;
}

.detail-item,
.stat-card{
background:#f8fafc;
padding:14px;
border-radius:10px;
}

.detail-label,
.stat-label{
display:block;
font-size:13px;
color:#64748b;
margin-bottom:5px;
}

.stat-number{
font-size:23px;
font-weight:bold;
}

.section-title-row{
display:flex;
align-items:center;
justify-content:space-between;
}

.player-count{
background:#0b1f3a;
color:white;
padding:6px 10px;
border-radius:20px;
}

.players-grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));
gap:12px;
}

.player-card{
display:flex;
align-items:center;
gap:12px;
padding:14px;
background:#f8fafc;
border-radius:12px;
}

.player-number{
width:35px;
height:35px;
border-radius:50%;
background:#0b1f3a;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
}

.player-name{
font-weight:bold;
}

.player-role{
font-size:13px;
color:#64748b;
margin-top:4px;
}

.no-players{
text-align:center;
padding:30px;
color:#64748b;
}

.error-box{
background:#fee2e2;
padding:25px;
border-radius:15px;
text-align:center;
}

.error-icon{
font-size:40px;
}

.back-button{
border:0;
background:#0b1f3a;
color:white;
padding:12px 18px;
border-radius:9px;
font-weight:bold;
}

.main-back{
width:100%;
}

</style>

</head>


<body>


<header class="topbar">

<div class="topbar-inner">

<div class="logo">
Crick<span>Mate</span>
</div>

<a
href="teams.html"
class="back"
>
← Back to Teams
</a>

</div>

</header>


<div id="teamContainer">

<div style="
text-align:center;
padding:50px;
color:#64748b;
">

Loading team...

</div>

</div>


<script
type="module"
src="./js/team.js"
></script>


</body>

</html>
