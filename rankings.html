<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Rankings - CrickMate</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6f9;
color:#172033;
}

/* HEADER */

.header{
background:#0b1f3a;
color:white;
padding:15px;
}

.header-inner{
max-width:1100px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:24px;
font-weight:800;
}

.logo span{
color:#22c55e;
}

.back-btn{
text-decoration:none;
color:white;
background:rgba(255,255,255,.12);
padding:9px 13px;
border-radius:9px;
}

/* MAIN */

.container{
max-width:1100px;
margin:auto;
padding:25px 15px 40px;
}

.page-title h1{
margin:0 0 7px;
font-size:29px;
}

.page-title p{
margin:0;
color:#64748b;
}

/* FILTER */

.filter-card{
margin-top:20px;
background:white;
padding:16px;
border-radius:15px;
box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.filter-card label{
display:block;
margin-bottom:7px;
font-weight:bold;
}

.filter-card select{
width:100%;
max-width:450px;
padding:12px;
border:1px solid #d5dbe5;
border-radius:10px;
background:white;
font-size:15px;
}

/* TABS */

.tabs{
display:flex;
gap:8px;
overflow-x:auto;
margin:20px 0;
padding-bottom:4px;
}

.tab{
white-space:nowrap;
border:1px solid #d8dee8;
background:white;
padding:11px 16px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.tab.active{
background:#0b1f3a;
color:white;
border-color:#0b1f3a;
}

/* CARD */

.ranking-card{
background:white;
border-radius:16px;
overflow:hidden;
box-shadow:0 4px 16px rgba(0,0,0,.06);
}

.ranking-header{
padding:18px;
border-bottom:1px solid #e5e7eb;
}

.ranking-header h2{
margin:0 0 5px;
font-size:20px;
}

.ranking-header p{
margin:0;
color:#64748b;
font-size:14px;
}

/* TABLE */

.table-container{
width:100%;
overflow-x:auto;
}

table{
width:100%;
min-width:700px;
border-collapse:collapse;
}

th{
padding:13px;
text-align:left;
background:#f8fafc;
color:#64748b;
font-size:13px;
}

td{
padding:14px 13px;
border-top:1px solid #eef0f3;
}

.rank{
width:65px;
font-size:18px;
font-weight:bold;
}

.player-box{
display:flex;
align-items:center;
gap:10px;
}

.avatar{
width:40px;
height:40px;
border-radius:50%;
background:#e8edf3;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
}

.player-name{
font-weight:bold;
}

.team-name{
margin-top:3px;
font-size:12px;
color:#64748b;
}

.rating{
font-weight:bold;
color:#0b1f3a;
}

.green{
color:#16a34a;
font-weight:bold;
}

.empty{
padding:45px 20px;
text-align:center;
color:#64748b;
display:none;
}

/* FOOTER */

footer{
background:#0b1f3a;
color:white;
text-align:center;
padding:25px 15px;
margin-top:20px;
}

/* MOBILE */

@media(max-width:600px){

.page-title h1{
font-size:25px;
}

.container{
padding-top:20px;
}

.tab{
padding:10px 13px;
}

}

</style>

</head>

<div class="table-container">

</table>

</div>


<div
id="emptyMessage"
class="empty"

</section>


</main>

/* =========================================
   MEDAL
========================================= */

function getRank(index){

if(index===0){
return "🥇";
}

if(index===1){
return "🥈";
}

if(index===2){
return "🥉";
}

return index+1;

}


/* =========================================
   SHOW RANKING
========================================= */

function showRanking(type,button){

document
.querySelectorAll(".tab")
.forEach(function(tab){

tab.classList.remove("active");

});

button.classList.add("active");


if(type==="batting"){

document.getElementById(
"rankingTitle"
).textContent="Top Batters";

document.getElementById(
"rankingSubtitle"
).textContent=
"Ranked by batting performance";

renderBatting();

}


else if(type==="bowling"){

document.getElementById(
"rankingTitle"
).textContent="Top Bowlers";

document.getElementById(
"rankingSubtitle"
).textContent=
"Ranked by bowling performance";

renderBowling();

}


else if(type==="allrounder"){

document.getElementById(
"rankingTitle"
).textContent=
"Top All-Rounders";

document.getElementById(
"rankingSubtitle"
).textContent=
"Best combined batting and bowling";

renderAllRounder();

}


else if(type==="teams"){

document.getElementById(
"rankingTitle"
).textContent=
"Top Teams";

document.getElementById(
"rankingSubtitle"
).textContent=
"Ranked by team performance";

renderTeams();

}

}

========================================= */
