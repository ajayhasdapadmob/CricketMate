<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>CrickMate - Match</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #0f172a;
}

.header {
    background: #0f172a;
    color: white;
    padding: 18px;
}

.header h1 {
    margin: 0;
    font-size: 22px;
}

.header p {
    margin: 5px 0 0;
    color: #94a3b8;
    font-size: 13px;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 15px;
}

.back {
    display: inline-block;
    margin-bottom: 15px;
    color: #0f172a;
    text-decoration: none;
    font-weight: bold;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 15px;
    border: 1px solid #e2e8f0;
}

.loading {
    text-align: center;
    padding: 35px;
    color: #64748b;
}

.match-number {
    text-align: center;
    color: #64748b;
    font-size: 14px;
}

.teams {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
    margin: 20px 0;
}

.team {
    text-align: center;
    font-weight: bold;
}

.score {
    font-size: 28px;
    margin-top: 8px;
}

.vs {
    font-weight: bold;
    color: #64748b;
}

.status {
    text-align: center;
    padding: 10px;
    border-radius: 8px;
    background: #dcfce7;
    color: #166534;
    font-weight: bold;
}

.winner {
    text-align: center;
    margin-top: 12px;
    padding: 14px;
    border-radius: 10px;
    background: #fef3c7;
    color: #92400e;
    font-weight: bold;
}

.info-row {
    padding: 11px 0;
    border-bottom: 1px solid #e2e8f0;
}

.info-row:last-child {
    border-bottom: 0;
}

.commentary {
    padding: 10px 0;
    border-bottom: 1px solid #e2e8f0;
}

.commentary:last-child {
    border-bottom: 0;
}

.ball {
    font-weight: bold;
    color: #334155;
}

.comment {
    margin-top: 4px;
}

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.btn {
    display: block;
    text-align: center;
    padding: 13px;
    border-radius: 9px;
    background: #0f172a;
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.error {
    background: #fee2e2;
    color: #991b1b;
    padding: 14px;
    border-radius: 9px;
}

.empty {
    text-align: center;
    padding: 20px;
    color: #64748b;
}

@media(max-width:500px) {

    .buttons {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<header class="header">

    <h1>🏏 CrickMate</h1>

    <p>Match Details & Scorecard</p>

</header>


<main class="container">


    <a
        id="backBtn"
        href="live.html"
        class="back"
    >
        ← Back
    </a>


    <div
        id="loading"
        class="loading"
    >

        🔄 Loading match...

    </div>


    <div
        id="error"
        style="display:none;"
    ></div>


    <div
        id="matchPage"
        style="display:none;"
    >


        <!-- MATCH CARD -->

        <div class="card">


            <div
                id="matchNumber"
                class="match-number"
            >
                Match
            </div>


            <div class="teams">


                <div class="team">

                    <div id="team1">
                        Team 1
                    </div>

                    <div
                        id="scoreA"
                        class="score"
                    >
                        0/0
                    </div>

                </div>


                <div class="vs">
                    VS
                </div>


                <div class="team">

                    <div id="team2">
                        Team 2
                    </div>

                    <div
                        id="scoreB"
                        class="score"
                    >
                        0/0
                    </div>

                </div>


            </div>


            <div
                id="status"
                class="status"
            >
                Scheduled
            </div>


            <div
                id="winner"
                class="winner"
                style="display:none;"
            ></div>


        </div>



        <!-- MATCH INFORMATION -->

        <div class="card">

            <h3>
                📋 Match Information
            </h3>


            <div class="info-row">

                🏆 Tournament:
                <strong id="tournament">
                    -
                </strong>

            </div>


            <div class="info-row">

                📅 Date:
                <strong id="date">
                    -
                </strong>

            </div>


            <div class="info-row">

                ⏰ Time:
                <strong id="time">
                    -
                </strong>

            </div>


            <div class="info-row">

                📍 Venue:
                <strong id="venue">
                    -
                </strong>

            </div>


            <div class="info-row">

                🏆 Result:
                <strong id="result">
                    -
                </strong>

            </div>


        </div>



        <!-- ACTIONS -->

        <div class="card">

            <div class="buttons">


                <a
                    id="liveScoreBtn"
                    class="btn"
                    href="#"
                >

                    🏏 Live Score

                </a>


                <a
                    id="commentaryBtn"
                    class="btn"
                    href="#"
                >

                    📝 Commentary

                </a>


            </div>

        </div>



        <!-- COMMENTARY -->

        <div class="card">

            <h3>
                📢 Ball-by-Ball Commentary
            </h3>


            <div id="commentary">

                📝 No commentary yet.

            </div>

        </div>


    </div>


</main>


<script
    type="module"
    src="./js/match.js"
></script>


</body>

</html>
