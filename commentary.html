<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Live Commentary - CrickMate</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #0f172a;
}

.header {
    background: #0f172a;
    color: white;
    padding: 16px;
}

.header h1 {
    margin: 0;
    font-size: 21px;
}

.header p {
    margin: 5px 0 0;
    color: #94a3b8;
    font-size: 12px;
}

.container {
    max-width: 700px;
    margin: 20px auto;
    padding: 0 14px;
}

.back {
    display: inline-block;
    margin-bottom: 15px;
    color: #0f172a;
    text-decoration: none;
    font-weight: bold;
}

.card {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 15px;
}

.match-title {
    text-align: center;
}

.match-title h2 {
    margin: 5px 0;
}

.score {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 15px;
}

.team {
    flex: 1;
    padding: 15px;
    background: #f8fafc;
    border-radius: 10px;
    text-align: center;
}

.team-name {
    font-weight: bold;
    font-size: 14px;
}

.team-score {
    margin-top: 7px;
    font-size: 22px;
    font-weight: bold;
}

.status {
    text-align: center;
    margin-top: 12px;
    font-weight: bold;
}

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.commentary {
    margin-top: 10px;
}

.ball {
    border-bottom: 1px solid #e2e8f0;
    padding: 14px 5px;
}

.ball:last-child {
    border-bottom: 0;
}

.ball-number {
    font-size: 12px;
    color: #64748b;
    margin-bottom: 5px;
}

.ball-text {
    font-size: 15px;
    font-weight: 500;
}

.runs {
    display: inline-block;
    margin-left: 8px;
    padding: 3px 8px;
    border-radius: 20px;
    background: #dcfce7;
    color: #166534;
    font-size: 12px;
    font-weight: bold;
}

.empty {
    text-align: center;
    padding: 30px 10px;
    color: #64748b;
}

.error {
    background: #fee2e2;
    color: #991b1b;
    padding: 12px;
    border-radius: 8px;
}

.loading {
    text-align: center;
    padding: 25px;
    color: #64748b;
}

</style>

</head>

<body>

<header class="header">

    <h1>🏏 CrickMate</h1>

    <p>Live Match Commentary</p>

</header>


<div class="container">

    <a
        href="#"
        id="backBtn"
        class="back"
    >
        ← Back
    </a>


    <!-- MATCH -->

    <div class="card">

        <div
            id="matchLoading"
            class="loading"
        >
            🔄 Loading match...
        </div>


        <div
            id="matchBox"
            style="display:none;"
        >

            <div class="match-title">

                <div id="matchNumber">
                    Match
                </div>

                <h2 id="matchTeams">
                    Team A vs Team B
                </h2>

                <div id="matchDate">
                </div>

            </div>


            <div class="score">

                <div class="team">

                    <div
                        id="team1Name"
                        class="team-name"
                    >
                        Team 1
                    </div>

                    <div
                        id="team1Score"
                        class="team-score"
                    >
                        0/0
                    </div>

                </div>


                <div class="team">

                    <div
                        id="team2Name"
                        class="team-name"
                    >
                        Team 2
                    </div>

                    <div
                        id="team2Score"
                        class="team-score"
                    >
                        0/0
                    </div>

                </div>

            </div>


            <div
                id="matchStatus"
                class="status"
            >
                Scheduled
            </div>

        </div>

    </div>


    <!-- COMMENTARY -->

    <div class="card">

        <div class="section-title">

            <h2>
                📝 Commentary
            </h2>

            <strong id="ballCount">
                0 balls
            </strong>

        </div>


        <div
            id="commentary"
            class="commentary"
        >

            <div class="loading">
                🔄 Loading commentary...
            </div>

        </div>

    </div>

</div>


<script
    type="module"
    src="./js/commentry.js"
></script>

</body>
</html>
