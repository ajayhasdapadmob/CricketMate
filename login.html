<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - CrickMate</title>

    <meta
        name="theme-color"
        content="#0f172a"
    >

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

    <style>

        .auth-page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e293b
                );
        }

        .auth-card {
            width: 100%;
            max-width: 430px;

            padding: 32px;

            background: white;

            border-radius: 18px;

            box-shadow:
                0 20px 60px
                rgba(0,0,0,0.25);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .auth-logo-icon {
            width: 65px;
            height: 65px;

            margin: auto;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #0f172a;

            border-radius: 50%;

            font-size: 32px;
        }

        .auth-logo h1 {
            margin: 12px 0 4px;
        }

        .auth-logo p {
            margin: 0;

            color: #64748b;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-weight: 600;

            font-size: 14px;
        }

        .form-group input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #cbd5e1;

            border-radius: 9px;

            outline: none;

            font-size: 15px;
        }

        .form-group input:focus {
            border-color: #0f172a;
        }

        .auth-submit {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #0f172a;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        .auth-submit:disabled {
            opacity: 0.6;

            cursor: not-allowed;
        }

        .auth-message {
            display: none;

            margin: 15px 0;

            padding: 12px;

            border-radius: 8px;

            font-size: 14px;

            text-align: center;
        }

        .auth-message.error {
            display: block;

            background: #fee2e2;

            color: #991b1b;
        }

        .auth-message.success {
            display: block;

            background: #dcfce7;

            color: #166534;
        }

        .auth-link {
            margin-top: 22px;

            text-align: center;

            font-size: 14px;

            color: #64748b;
        }

        .auth-link a {
            color: #0f172a;

            font-weight: bold;

            text-decoration: none;
        }

        .back-home {
            display: block;

            margin-top: 18px;

            text-align: center;

            color: #64748b;

            text-decoration: none;

            font-size: 13px;
        }

    </style>

</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">

                <div class="auth-logo-icon">
                    🏏
                </div>

                <h1>
                    CrickMate
                </h1>

                <p>
                    Welcome back, Cricket Mate!
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <div
                    id="loginMessage"
                    class="auth-message"
                ></div>


                <button
                    type="submit"
                    id="loginSubmit"
                    class="auth-submit"
                >
                    Login
                </button>

            </form>


            <div class="auth-link">

                Don't have an account?

                <a href="./register.html">
                    Create Account
                </a>

            </div>


            <a
                href="./index.html"
                class="back-home"
            >
                ← Back to CrickMate
            </a>

        </div>

    </main>


    <script
        type="module"
        src="./js/login.js"
    ></script>

</body>

</html>
