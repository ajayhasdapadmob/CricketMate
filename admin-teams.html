<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Admin Teams - CrickMate</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #0f172a;
}

.header {
    background: #0f172a;
    color: white;
    padding: 18px 15px;
}

.header-inner {
    max-width: 1100px;
    margin: auto;
}

.header h1 {
    margin: 0;
    font-size: 22px;
}

.header p {
    margin: 5px 0 0;
    color: #94a3b8;
    font-size: 13px;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px 15px 40px;
}

.back {
    display: inline-block;
    margin-bottom: 18px;
    color: #0f172a;
    text-decoration: none;
    font-weight: bold;
}

.toolbar {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 15px;
    padding: 18px;
    margin-bottom: 18px;
}

.toolbar-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.toolbar h2 {
    margin: 0;
    font-size: 20px;
}

.count {
    background: #e2e8f0;
    padding: 6px 11px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.tournament-id {
    margin-top: 8px;
    color: #64748b;
    font-size: 11px;
    word-break: break-all;
}

.list {
    display: grid;
    grid-template-columns:
        repeat(2, 1fr);
    gap: 15px;
}

.team-card {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 18px;
}

.team-header {
    display: flex;
    align-items: center;
    gap: 13px;
}

.logo {
    width: 58px;
    height: 58px;
    border-radius: 12px;
    background: #f1f5f9;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-size: 25px;
    flex-shrink: 0;
}

.logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.team-name {
    font-size: 18px;
    font-weight: bold;
}

.short-name {
    color: #64748b;
    font-size: 12px;
    margin-top: 4px;
}

.details {
    margin-top: 17px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
}

.detail {
    background: #f8fafc;
    padding: 10px;
    border-radius: 9px;
}

.detail-label {
    display: block;
    color: #64748b;
    font-size: 10px;
    margin-bottom: 4px;
}

.detail-value {
    font-size: 12px;
    font-weight: bold;
    word-break: break-word;
}

.stats {
    display: grid;
    grid-template-columns:
        repeat(4, 1fr);
    gap: 7px;
    margin-top: 12px;
}

.stat {
    text-align: center;
    background: #f8fafc;
    padding: 8px 4px;
    border-radius: 8px;
}

.stat-number {
    font-size: 14px;
    font-weight: bold;
}

.stat-label {
    font-size: 9px;
    color: #64748b;
    margin-top: 3px;
}

.actions {
    margin-top: 15px;
}

.btn {
    display: inline-block;
    background: #0f172a;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    padding: 10px 13px;
    font-size: 12px;
    font-weight: bold;
}

.loading,
.empty,
.error {
    grid-column: 1 / -1;
    background: white;
    border-radius: 15px;
    padding: 30px;
    text-align: center;
    border: 1px solid #e2e8f0;
}

.error {
    color: #991b1b;
    background: #fee2e2;
}

@media (max-width: 700px) {

    .list {
        grid-template-columns: 1fr;
    }

}

@media (max-width: 450px) {

    .details {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<header class="header">

    <div class="header-inner">

        <h1>
            🏏 CrickMate Admin
        </h1>

        <p>
            Team Management
        </p>

    </div>

</header>


<main class="container">


    <a
        href="admin.html"
        class="back"
    >
        ← Admin Dashboard
    </a>


    <div class="toolbar">

        <div class="toolbar-top">

            <h2>
                👥 Teams
            </h2>

            <span
                id="teamCount"
                class="count"
            >
                0
            </span>

        </div>


        <div
            id="tournamentInfo"
            class="tournament-id"
        >
            Loading tournament...
        </div>

    </div>


    <div
        id="teamList"
        class="list"
    >

        <div class="loading">
            🔥 Loading teams...
        </div>

    </div>


</main>


<script
    type="module"
    src="./js/admin-teams.js"
></script>


</body>

</html>
