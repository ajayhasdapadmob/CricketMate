<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>CrickMate - Leaderboard</title>

<link
    rel="stylesheet"
    href="./css/style.css"
>

<style>

.leaderboard-page {
    max-width: 800px;
    margin: auto;
    padding: 20px;
}

.page-header {
    background: #0f172a;
    color: white;
    padding: 20px;
    border-radius: 14px;
    margin-bottom: 20px;
}

.page-header h1 {
    margin: 0;
}

.page-header p {
    margin: 6px 0 0;
    color: #cbd5e1;
}

.leaderboard-card {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 12px;

    display: grid;
    grid-template-columns: 55px 1fr auto;
    align-items: center;
    gap: 12px;
}

.rank {
    font-size: 22px;
    font-weight: bold;
    text-align: center;
}

.player-name {
    font-weight: bold;
}

.player-info {
    color: #64748b;
    font-size: 13px;
    margin-top: 4px;
}

.player-score {
    text-align: right;
    font-weight: bold;
}

.player-score span {
    display: block;
    color: #64748b;
    font-size: 12px;
    font-weight: normal;
}

.loading {
    text-align: center;
    padding: 30px;
    color: #64748b;
}

.empty {
    text-align: center;
    padding: 30px;
    background: white;
    border-radius: 12px;
    color: #64748b;
}

.back {
    display: inline-block;
    margin-bottom: 15px;
    text-decoration: none;
    color: #0f172a;
    font-weight: bold;
}

</style>

</head>


<body>


<main class="leaderboard-page">


<a
    href="./index.html"
    class="back"
>
    ← Back
</a>


<div class="page-header">

    <h1>🏆 Leaderboard</h1>

    <p>
        CrickMate Player Rankings
    </p>

</div>


<div
    id="leaderboardContainer"
>

    <div class="loading">
        🔄 Loading leaderboard...
    </div>

</div>


</main>


<script
    type="module"
    src="./js/leaderboard.js"
></script>


</body>

</html>
