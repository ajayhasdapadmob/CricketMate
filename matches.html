<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Matches - CrickMate</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #0f172a;
}

.header {
    background: #0f172a;
    color: white;
    padding: 16px;
}

.header-inner {
    max-width: 1000px;
    margin: auto;
}

.header h1 {
    margin: 0;
    font-size: 21px;
}

.header p {
    margin: 5px 0 0;
    color: #94a3b8;
    font-size: 13px;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px 15px 40px;
}

.back {
    display: inline-block;
    margin-bottom: 18px;
    color: #0f172a;
    text-decoration: none;
    font-weight: bold;
}

.page-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    gap: 15px;
}

.page-top h2 {
    margin: 0;
}

.match-count {
    color: #64748b;
    font-size: 13px;
    margin-top: 5px;
}

.matches {
    display: grid;
    gap: 16px;
}

.match-card {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 2px 8px rgba(15,23,42,.04);
}

.match-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
}

.match-number {
    font-weight: bold;
    color: #475569;
}

.status {
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
}

.status-completed {
    background: #dcfce7;
    color: #166534;
}

.status-live {
    background: #fee2e2;
    color: #991b1b;
}

.status-upcoming {
    background: #e0f2fe;
    color: #075985;
}

.teams {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
}

.team {
    padding: 15px;
    background: #f8fafc;
    border-radius: 12px;
}

.team:last-child {
    text-align: right;
}

.team-name {
    font-size: 17px;
    font-weight: bold;
}

.score {
    margin-top: 8px;
    font-size: 20px;
    font-weight: bold;
}

.vs {
    font-weight: bold;
    color: #94a3b8;
}

.winner {
    color: #15803d;
}

.match-info {
    margin-top: 15px;
    padding-top: 12px;
    border-top: 1px solid #e2e8f0;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    color: #64748b;
    font-size: 13px;
}

.result {
    margin-top: 14px;
    padding: 12px;
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    border-radius: 10px;
    color: #166534;
    font-weight: bold;
}

.actions {
    margin-top: 15px;
    display: flex;
    gap: 10px;
}

.view-btn {
    display: block;
    flex: 1;
    text-align: center;
    text-decoration: none;
    background: #0f172a;
    color: white;
    padding: 11px;
    border-radius: 9px;
    font-weight: bold;
    font-size: 13px;
}

.empty,
.loading,
.error {
    background: white;
    border-radius: 16px;
    padding: 35px 20px;
    text-align: center;
}

.loading {
    color: #64748b;
}

.empty {
    color: #64748b;
}

.error {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #991b1b;
}

@media (max-width: 650px) {

    .teams {
        grid-template-columns: 1fr;
    }

    .team,
    .team:last-child {
        text-align: center;
    }

    .vs {
        text-align: center;
    }

    .match-header {
        align-items: flex-start;
    }

}

</style>

</head>


<body>


<header class="header">

    <div class="header-inner">

        <h1>
            🏏 CrickMate
        </h1>

        <p>
            Matches
        </p>

    </div>

</header>


<main class="container">


    <a
        id="backBtn"
        href="#"
        class="back"
    >
        ← Tournament Centre
    </a>


    <div class="page-top">

        <div>

            <h2>
                🏏 Matches
            </h2>

            <div
                id="matchCount"
                class="match-count"
            >
                Loading matches...
            </div>

        </div>

    </div>


    <div
        id="matchesContainer"
        class="matches"
    >

        <div class="loading">

            Loading matches...

        </div>

    </div>


</main>


<script
    type="module"
    src="./js/matches.js"
></script>


</body>

</html>
