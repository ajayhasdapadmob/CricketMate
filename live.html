<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>CrickMate - Live Matches</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #0f172a;
}

.header {
    background: #0f172a;
    color: white;
    padding: 18px;
}

.header h1 {
    margin: 0;
    font-size: 23px;
}

.header p {
    margin: 5px 0 0;
    color: #94a3b8;
    font-size: 13px;
}

.container {
    max-width: 750px;
    margin: auto;
    padding: 15px;
}

.back {
    display: inline-block;
    margin-bottom: 15px;
    text-decoration: none;
    color: #0f172a;
    font-weight: bold;
}

.card {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 15px;
}

.card h3 {
    margin-top: 0;
}

.loading {
    text-align: center;
    padding: 30px;
    color: #64748b;
}

.error {
    background: #fee2e2;
    color: #991b1b;
    padding: 14px;
    border-radius: 10px;
}

.empty {
    text-align: center;
    padding: 30px 15px;
    color: #64748b;
}

.match-card {
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 15px;
    margin-top: 12px;
    background: #fff;
}

.match-number {
    font-size: 12px;
    color: #64748b;
    margin-bottom: 8px;
}

.teams {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 8px;
    text-align: center;
}

.team {
    font-weight: bold;
}

.score {
    font-size: 21px;
    margin-top: 5px;
}

.vs {
    color: #64748b;
    font-weight: bold;
}

.status {
    display: inline-block;
    margin-top: 12px;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.live {
    background: #fee2e2;
    color: #b91c1c;
}

.completed {
    background: #dcfce7;
    color: #166534;
}

.scheduled {
    background: #dbeafe;
    color: #1d4ed8;
}

.result {
    margin-top: 10px;
    padding: 10px;
    background: #f8fafc;
    border-radius: 8px;
    font-size: 13px;
}

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
}

.btn {
    display: block;
    text-align: center;
    text-decoration: none;
    padding: 11px;
    border-radius: 8px;
    background: #0f172a;
    color: white;
    font-weight: bold;
    font-size: 13px;
}

.btn.commentary {
    background: #2563eb;
}

.tournament-name {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 15px;
    color: #334155;
}

.filter {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-bottom: 15px;
}

.filter button {
    border: 0;
    padding: 9px 13px;
    border-radius: 20px;
    background: #e2e8f0;
    color: #334155;
    font-weight: bold;
    white-space: nowrap;
}

.filter button.active {
    background: #0f172a;
    color: white;
}

@media(max-width:500px) {

    .buttons {
        grid-template-columns: 1fr;
    }

    .teams {
        gap: 5px;
    }

    .score {
        font-size: 19px;
    }

}

</style>

</head>


<body>


<header class="header">

    <h1>🏏 CrickMate</h1>

    <p>Live Matches & Match Updates</p>

</header>


<main class="container">


    <a
        href="index.html"
        class="back"
    >
        ← Back
    </a>


    <div class="card">

        <div
            id="tournamentName"
            class="tournament-name"
        >
            🏆 Loading tournament...
        </div>


        <div class="filter">

            <button
                id="allBtn"
                class="active"
                onclick="filterMatches('all')"
            >
                All
            </button>

            <button
                id="liveBtn"
                onclick="filterMatches('live')"
            >
                🔴 Live
            </button>

            <button
                id="completedBtn"
                onclick="filterMatches('completed')"
            >
                ✅ Completed
            </button>

            <button
                id="scheduledBtn"
                onclick="filterMatches('scheduled')"
            >
                📅 Scheduled
            </button>

        </div>


        <div
            id="loading"
            class="loading"
        >
            🔄 Loading matches...
        </div>


        <div
            id="matches"
        ></div>

    </div>


</main>


<script
    type="module"
    src="./js/live.js"
></script>


</body>

</html>
