<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>CrickMate - Scorecard</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #0f172a;
}

.header {
    background: #0f172a;
    color: white;
    padding: 18px;
}

.header h1 {
    margin: 0;
    font-size: 22px;
}

.header p {
    margin: 5px 0 0;
    color: #94a3b8;
    font-size: 13px;
}

.container {
    max-width: 750px;
    margin: auto;
    padding: 15px;
}

.back {
    display: inline-block;
    margin-bottom: 15px;
    color: #0f172a;
    text-decoration: none;
    font-weight: bold;
}

.card {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 15px;
}

.loading {
    text-align: center;
    padding: 40px;
    color: #64748b;
}

.match-title {
    text-align: center;
    color: #64748b;
    font-size: 13px;
}

.teams {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
    margin: 20px 0;
}

.team {
    text-align: center;
}

.team-name {
    font-size: 17px;
    font-weight: bold;
}

.score {
    font-size: 25px;
    font-weight: bold;
    margin-top: 6px;
}

.vs {
    font-weight: bold;
    color: #64748b;
}

.status {
    text-align: center;
    padding: 10px;
    border-radius: 8px;
    background: #dcfce7;
    color: #166534;
    font-weight: bold;
}

.result {
    margin-top: 12px;
    background: #eff6ff;
    color: #1e40af;
    padding: 12px;
    border-radius: 9px;
    text-align: center;
    font-weight: bold;
}

.section-title {
    font-size: 17px;
    margin: 0 0 12px;
}

.innings-title {
    background: #0f172a;
    color: white;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 12px;
    font-weight: bold;
}

.score-summary {
    display: flex;
    justify-content: space-between;
    background: #f8fafc;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 12px;
}

.table {
    width: 100%;
    border-collapse: collapse;
}

.table th,
.table td {
    padding: 10px 7px;
    border-bottom: 1px solid #e2e8f0;
    text-align: left;
    font-size: 13px;
}

.table th {
    background: #f8fafc;
    color: #475569;
}

.table th:not(:first-child),
.table td:not(:first-child) {
    text-align: center;
}

.ball {
    display: inline-block;
    min-width: 34px;
    padding: 7px 8px;
    margin: 3px;
    background: #f1f5f9;
    border-radius: 6px;
    text-align: center;
    font-weight: bold;
}

.ball.wicket {
    background: #fee2e2;
    color: #991b1b;
}

.ball.four {
    background: #dcfce7;
    color: #166534;
}

.ball.six {
    background: #dbeafe;
    color: #1e40af;
}

.commentary {
    padding: 10px;
    margin-bottom: 8px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    font-size: 13px;
}

.error {
    background: #fee2e2;
    color: #991b1b;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
}

@media(max-width:500px) {

    .teams {
        gap: 5px;
    }

    .team-name {
        font-size: 14px;
    }

    .score {
        font-size: 21px;
    }

    .table th,
    .table td {
        padding: 8px 4px;
        font-size: 12px;
    }

}

</style>

</head>


<body>


<header class="header">

    <h1>🏏 CrickMate</h1>

    <p>
        Match Scorecard
    </p>

</header>


<main class="container">


<a
    id="backBtn"
    class="back"
    href="#"
>
    ← Back
</a>


<div
    id="loading"
    class="loading"
>
    🔄 Loading scorecard...
</div>


<div
    id="scorecard"
    style="display:none;"
>


    <!-- MATCH -->

    <div class="card">

        <div
            id="matchTitle"
            class="match-title"
        >
            Match
        </div>


        <div class="teams">


            <div class="team">

                <div
                    id="team1Name"
                    class="team-name"
                >
                    Team 1
                </div>

                <div
                    id="scoreA"
                    class="score"
                >
                    0/0
                </div>

            </div>


            <div class="vs">
                VS
            </div>


            <div class="team">

                <div
                    id="team2Name"
                    class="team-name"
                >
                    Team 2
                </div>

                <div
                    id="scoreB"
                    class="score"
                >
                    0/0
                </div>

            </div>

        </div>


        <div
            id="status"
            class="status"
        >
            Completed
        </div>


        <div
            id="result"
            class="result"
        >
        </div>

    </div>


    <!-- INNINGS -->

    <div
        id="inningsContainer"
    >
    </div>


    <!-- BALL BY BALL -->

    <div class="card">

        <h3 class="section-title">
            🏏 Ball-by-Ball
        </h3>

        <div
            id="ballByBall"
        >
            No balls recorded.
        </div>

    </div>


    <!-- COMMENTARY -->

    <div class="card">

        <h3 class="section-title">
            📢 Commentary
        </h3>

        <div
            id="commentary"
        >
            No commentary yet.
        </div>

    </div>


</div>


</main>


<script
    type="module"
    src="./js/scorecard.js"
></script>


</body>

</html>
