<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>CrickMate - Scorer</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #0f172a;
}

.header {
    background: #0f172a;
    color: white;
    padding: 18px;
}

.header h1 {
    margin: 0;
    font-size: 22px;
}

.header p {
    margin: 5px 0 0;
    color: #94a3b8;
    font-size: 13px;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 15px;
}

.back {
    display: inline-block;
    margin-bottom: 15px;
    color: #0f172a;
    text-decoration: none;
    font-weight: bold;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 15px;
    border: 1px solid #e2e8f0;
}

.tournament-name {
    font-size: 20px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 8px;
}

.match-count {
    text-align: center;
    color: #64748b;
    font-size: 13px;
}

.message {
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 12px;
    display: none;
}

.message.show {
    display: block;
}

.message.success {
    background: #dcfce7;
    color: #166534;
}

.message.error {
    background: #fee2e2;
    color: #991b1b;
}

.loading {
    text-align: center;
    padding: 30px;
    color: #64748b;
}

/* =====================================================
   SCORER MATCH LIST
===================================================== */

#resultsContainer {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.scorer-match {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
}

.scorer-match h3 {
    margin: 0 0 10px;
    font-size: 16px;
}

.scorer-teams {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 8px;
    text-align: center;
}

.scorer-team {
    font-weight: bold;
}

.scorer-score {
    font-size: 20px;
    margin-top: 5px;
}

.scorer-vs {
    color: #64748b;
    font-weight: bold;
}

.scorer-status {
    margin-top: 12px;
    padding: 8px;
    border-radius: 8px;
    background: #f1f5f9;
    text-align: center;
    font-size: 13px;
    font-weight: bold;
}

.scorer-result {
    margin-top: 10px;
    padding: 10px;
    border-radius: 8px;
    background: #dcfce7;
    color: #166534;
    font-weight: bold;
    text-align: center;
}

.scorer-button {
    display: block;
    width: 100%;
    margin-top: 12px;
    padding: 11px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-weight: bold;
    text-decoration: none;
    text-align: center;
}

.scorer-button:hover {
    background: #1d4ed8;
}

@media (max-width: 500px) {

    .scorer-teams {
        grid-template-columns: 1fr auto 1fr;
    }

    .scorer-score {
        font-size: 18px;
    }

}

/* =====================================================
   MATCH CARD
===================================================== */

.match-card {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 15px;
}

.match-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
}

.match-top strong {
    font-size: 15px;
}

.match-date {
    display: block;
    color: #64748b;
    font-size: 12px;
    margin-top: 4px;
}

.venue {
    font-size: 12px;
    color: #64748b;
    margin-bottom: 12px;
}

.status-badge {
    padding: 6px 9px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
    white-space: nowrap;
}

.status-badge.completed {
    background: #dcfce7;
    color: #166534;
}

.status-badge.live {
    background: #fee2e2;
    color: #991b1b;
}

.status-badge.scheduled {
    background: #e0f2fe;
    color: #075985;
}


/* =====================================================
   TEAMS
===================================================== */

.teams {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
    margin: 18px 0;
}

.team {
    text-align: center;
}

.team-name {
    font-weight: bold;
    font-size: 14px;
}

.score {
    font-size: 23px;
    font-weight: bold;
    margin-top: 6px;
}

.vs {
    color: #64748b;
    font-weight: bold;
}


/* =====================================================
   RESULT
===================================================== */

.result {
    background: #f0fdf4;
    color: #166534;
    padding: 12px;
    border-radius: 9px;
    text-align: center;
    font-weight: bold;
    margin-top: 10px;
}


/* =====================================================
   BUTTONS
===================================================== */

.actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 14px;
}

.actions button {
    border: 0;
    border-radius: 8px;
    padding: 12px 8px;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.live-btn {
    background: #2563eb;
}

.scorecard-btn {
    background: #0f172a;
}

.actions button:active {
    transform: scale(.97);
}


/* =====================================================
   EMPTY
===================================================== */

.empty {
    background: white;
    padding: 30px;
    text-align: center;
    border-radius: 12px;
    color: #64748b;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:500px) {

    .teams {
        gap: 5px;
    }

    .team-name {
        font-size: 13px;
    }

    .score {
        font-size: 20px;
    }

    .actions {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <h1>
        🏏 CrickMate
    </h1>

    <p>
        Scorer Dashboard
    </p>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">


    <!-- BACK -->

    <a
        id="backBtn"
        href="#"
        class="back"
    >
        ← Back
    </a>


    <!-- MESSAGE -->

    <div
        id="message"
        class="message"
    ></div>


    <!-- TOURNAMENT -->

    <div class="card">

        <div
            id="tournamentName"
            class="tournament-name"
        >
            Loading tournament...
        </div>


        <div
            id="matchCount"
            class="match-count"
        >
            Loading matches...
        </div>

    </div>


    <!-- LOADING -->

    <div
        id="loading"
        class="loading"
    >
        🔄 Loading scorer...
    </div>


    <!-- =================================================
         IMPORTANT:
         JS YAHAN MATCH CARDS BANAYEGA
    ================================================== -->

    <div
        id="resultsContainer"
    ></div>


</main>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script
    type="module"
    src="./js/scorer.js"
></script>


</body>

</html>
