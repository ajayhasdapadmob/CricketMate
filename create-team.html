<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Create Team - CrickMate</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #0f172a;
}

.header {
    background: #0f172a;
    color: white;
    padding: 16px 20px;
}

.header h1 {
    margin: 0;
    font-size: 21px;
}

.header p {
    margin: 5px 0 0;
    color: #94a3b8;
    font-size: 12px;
}

.container {
    max-width: 700px;
    margin: 25px auto;
    padding: 0 15px 40px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 15px;
    border: 1px solid #e2e8f0;
}

.card h2 {
    margin-top: 0;
}

.section-title {
    margin-top: 28px;
    padding: 12px;
    background: #f1f5f9;
    border-radius: 10px;
    font-size: 17px;
    font-weight: bold;
}

label {
    display: block;
    margin-top: 17px;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: bold;
}

input,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    outline: none;
    font-size: 14px;
}

input:focus,
textarea:focus {
    border-color: #0f172a;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

.player-box {
    display: grid;
    grid-template-columns: 55px 1fr;
    gap: 10px;
    align-items: center;
    margin-top: 10px;
}

.player-number {
    background: #0f172a;
    color: white;
    padding: 12px 5px;
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
}

.player-box input {
    margin: 0;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 13px;
    border: 0;
    border-radius: 9px;
    background: #16a34a;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.back {
    display: inline-block;
    margin-bottom: 18px;
    color: #0f172a;
    text-decoration: none;
    font-weight: bold;
}

.message {
    display: none;
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    font-size: 13px;
}

.success {
    display: block;
    background: #dcfce7;
    color: #166534;
}

.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

.tournament-id {
    padding: 10px;
    background: #f8fafc;
    border-radius: 8px;
    color: #64748b;
    font-size: 11px;
    word-break: break-all;
}

</style>

</head>

<body>

<header class="header">

    <h1>🏏 CrickMate</h1>

    <p>Create Tournament Team</p>

</header>


<div class="container">

<a
    href="#"
    id="backBtn"
    class="back"
>
    ← Back to Tournament
</a>


<div class="card">

<h2>👥 Create Team</h2>


<p class="tournament-id">

Tournament ID:

<strong id="tournamentIdText">
Loading...
</strong>

</p>


<form id="teamForm">


<!-- TEAM INFORMATION -->

<div class="section-title">
    🏏 Team Information
</div>


<label for="teamName">
    Team Name *
</label>

<input
    id="teamName"
    type="text"
    placeholder="Example: Assam Warriors"
    required
>


<label for="shortName">
    Short Name *
</label>

<input
    id="shortName"
    type="text"
    maxlength="8"
    placeholder="Example: AW"
    required
>


<label for="city">
    City / Area
</label>

<input
    id="city"
    type="text"
    placeholder="Example: Sonitpur"
>


<label for="logo">
    Team Logo URL
</label>

<input
    id="logo"
    type="url"
    placeholder="https://example.com/logo.png"
>


<label for="description">
    Description
</label>

<textarea
    id="description"
    placeholder="Team information..."
></textarea>


<!-- CAPTAIN -->

<div class="section-title">
    👑 Captain / Contact
</div>


<label for="captainName">
    Captain Name *
</label>

<input
    id="captainName"
    type="text"
    placeholder="Captain full name"
    required
>


<label for="mobile">
    Mobile Number *
</label>

<input
    id="mobile"
    type="tel"
    maxlength="10"
    inputmode="numeric"
    placeholder="10 digit mobile number"
    required
>


<label for="email">
    Email ID *
</label>

<input
    id="email"
    type="email"
    placeholder="captain@example.com"
    required
>


<!-- PLAYERS -->

<div class="section-title">
    🏏 Players
</div>

<p style="font-size:13px;color:#64748b;">
    Enter the players who are part of this team.
    Player 1 will be treated as Captain.
</p>


<div class="player-box">
    <div class="player-number">1</div>
    <input
        id="player1"
        type="text"
        placeholder="Player 1 - Captain"
        required
    >
</div>


<div class="player-box">
    <div class="player-number">2</div>
    <input
        id="player2"
        type="text"
        placeholder="Player 2"
    >
</div>


<div class="player-box">
    <div class="player-number">3</div>
    <input
        id="player3"
        type="text"
        placeholder="Player 3"
    >
</div>


<div class="player-box">
    <div class="player-number">4</div>
    <input
        id="player4"
        type="text"
        placeholder="Player 4"
    >
</div>


<div class="player-box">
    <div class="player-number">5</div>
    <input
        id="player5"
        type="text"
        placeholder="Player 5"
    >
</div>


<div class="player-box">
    <div class="player-number">6</div>
    <input
        id="player6"
        type="text"
        placeholder="Player 6"
    >
</div>


<div class="player-box">
    <div class="player-number">7</div>
    <input
        id="player7"
        type="text"
        placeholder="Player 7"
    >
</div>


<div class="player-box">
    <div class="player-number">8</div>
    <input
        id="player8"
        type="text"
        placeholder="Player 8"
    >
</div>


<div class="player-box">
    <div class="player-number">9</div>
    <input
        id="player9"
        type="text"
        placeholder="Player 9"
    >
</div>


<div class="player-box">
    <div class="player-number">10</div>
    <input
        id="player10"
        type="text"
        placeholder="Player 10"
    >
</div>


<div class="player-box">
    <div class="player-number">11</div>
    <input
        id="player11"
        type="text"
        placeholder="Player 11"
    >
</div>


<div class="player-box">
    <div class="player-number">12</div>
    <input
        id="player12"
        type="text"
        placeholder="Player 12"
    >
</div>


<div class="player-box">
    <div class="player-number">13</div>
    <input
        id="player13"
        type="text"
        placeholder="Player 13"
    >
</div>


<div class="player-box">
    <div class="player-number">14</div>
    <input
        id="player14"
        type="text"
        placeholder="Player 14"
    >
</div>


<div class="player-box">
    <div class="player-number">15</div>
    <input
        id="player15"
        type="text"
        placeholder="Player 15"
    >
</div>


<button
    id="saveBtn"
    type="submit"
>
    ➕ Create Team
</button>


</form>


<div
    id="message"
    class="message"
></div>


</div>

</div>


<script
    type="module"
    src="./js/create-team.js"
></script>

</body>

</html>
